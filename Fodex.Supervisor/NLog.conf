<?xml version="1.0" encoding="utf-8"?>
<nlog xmlns="http://www.nlog-project.org/schemas/NLog.xsd"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      autoReload="false" throwConfigExceptions="true">
  <!-- NLog owns buffering/file handles. Never silently drop IO trace records.
       FSI explicitly loads this file; do not change a machine-wide SDK config.
       Root: Logger.WithProperty; actor: native Akka WithContext from UniLogger.Tags. -->
  <targets>
    <target name="io" xsi:type="AsyncWrapper" queueLimit="10000" overflowAction="Block" batchSize="256">
      <target xsi:type="File" fileName="${event-properties:item=traceFile}"
              keepFileOpen="true" autoFlush="true" encoding="utf-8"
              layout="${substring:inner=${message}:start=9}" />
    </target>
    <target name="errors" xsi:type="Console" error="true" layout="${level}|${logger}|${message}" />
  </targets>
  <rules>
    <logger name="*" minlevel="Info" writeTo="io">
      <filters defaultAction="Log">
        <when condition="not starts-with('${message}', 'FODEX_IO ')" action="Ignore" />
        <when condition="'${event-properties:item=traceFile}' == ''" action="Ignore" />
      </filters>
    </logger>
    <logger name="*" minlevel="Warn" writeTo="errors" />
  </rules>
</nlog>
