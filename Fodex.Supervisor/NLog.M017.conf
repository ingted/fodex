<?xml version="1.0" encoding="utf-8"?>
<nlog xmlns="http://www.nlog-project.org/schemas/NLog.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" throwConfigExceptions="true">
  <targets>
    <target name="nativeIo" xsi:type="AsyncWrapper" queueLimit="10000" overflowAction="Block">
      <target xsi:type="File" fileName="${event-properties:item=traceFile}.native.jsonl" encoding="utf-8" layout="${substring:inner=${message}:start=12}" />
    </target>
    <target name="io" xsi:type="AsyncWrapper" queueLimit="10000" overflowAction="Block">
      <target xsi:type="File" fileName="${event-properties:item=traceFile}" encoding="utf-8" layout="${substring:inner=${message}:start=9}" />
    </target>
    <target name="control" xsi:type="File" fileName="${event-properties:item=traceFile}.control.log" encoding="utf-8" layout="${longdate}|${level}|${logger}|${message}" />
    <target name="errors" xsi:type="Console" error="true" layout="${level}|${message}" />
  </targets>
  <rules>
    <logger name="*" minlevel="Info" writeTo="nativeIo">
      <filters defaultAction="Log">
        <when condition="not starts-with('${message}', 'FODEX_STDIO ') or '${event-properties:item=traceFile}' == ''" action="Ignore" />
      </filters>
    </logger>
    <logger name="*" minlevel="Info" writeTo="io">
      <filters defaultAction="Log">
        <when condition="not starts-with('${message}', 'FODEX_IO ') or '${event-properties:item=traceFile}' == ''" action="Ignore" />
      </filters>
    </logger>
    <logger name="*" minlevel="Info" writeTo="control">
      <filters defaultAction="Log">
        <when condition="starts-with('${message}', 'FODEX_IO ') or starts-with('${message}', 'FODEX_STDIO ') or '${event-properties:item=traceFile}' == ''" action="Ignore" />
      </filters>
    </logger>
    <logger name="*" minlevel="Warn" writeTo="errors" />
  </rules>
</nlog>
